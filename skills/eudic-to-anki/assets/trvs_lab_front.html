<main class="context-anchor-card">
  <button class="word-button" type="button" onclick="playAudio()" aria-label="播放 {{单词}} 的发音">
    {{单词}}
  </button>
  <div id="word-audio" class="word-audio" aria-hidden="true">{{发音}}</div>
  <div id="card-sentence" class="card-sentence">{{卡片例句}}</div>
</main>

<script>
(function () {
  var wordButton = document.querySelector(".word-button");
  var word = wordButton ? wordButton.textContent.trim() : "";
  var sentence = document.getElementById("card-sentence");
  if (!word || !sentence) return;

  var escaped = word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  var pattern = new RegExp("(^|[^A-Za-z])(" + escaped + "(?:s|es|ed|ing)?)(?=$|[^A-Za-z])", "gi");
  var walker = document.createTreeWalker(sentence, NodeFilter.SHOW_TEXT);
  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(function (node) {
    var source = node.nodeValue;
    if (!pattern.test(source)) return;
    pattern.lastIndex = 0;
    var fragment = document.createDocumentFragment();
    var cursor = 0;
    source.replace(pattern, function (match, lead, target, offset) {
      fragment.appendChild(document.createTextNode(source.slice(cursor, offset) + lead));
      var mark = document.createElement("mark");
      mark.textContent = target;
      fragment.appendChild(mark);
      cursor = offset + match.length;
      return match;
    });
    fragment.appendChild(document.createTextNode(source.slice(cursor)));
    node.parentNode.replaceChild(fragment, node);
  });
})();

function playAudio() {
  var root = document.getElementById("word-audio");
  var control = root && root.querySelector(".replay-button, .soundLink, [onclick]");
  if (control) control.click();
}
</script>
