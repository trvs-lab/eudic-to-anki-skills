{{#短语块挖空}}
<div class="section top chunk-card chunk-recall-card">
  <div class="items recall-cloze">{{短语块挖空}}</div>
  <div class="items chunk-meaning recall-hint">{{短语块锚点}}</div>
</div>

<script>
(function() {
  [].forEach.call(document.querySelectorAll(".recall-cloze"), function(field) {
    highlightBlanks(field);
  });

  function highlightBlanks(root) {
    var regex = /_{2,}/g;
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        regex.lastIndex = 0;
        if (!node.nodeValue.trim() || !regex.test(node.nodeValue)) {
          return NodeFilter.FILTER_REJECT;
        }
        return NodeFilter.FILTER_ACCEPT;
      }
    });
    var nodes = [];
    var node;

    while ((node = walker.nextNode())) {
      nodes.push(node);
    }

    nodes.forEach(function(textNode) {
      wrapBlanks(textNode, regex);
    });
  }

  function wrapBlanks(textNode, regex) {
    var source = textNode.nodeValue;
    var fragment = document.createDocumentFragment();
    var lastIndex = 0;

    regex.lastIndex = 0;
    source.replace(regex, function(match, offset) {
      fragment.appendChild(document.createTextNode(source.slice(lastIndex, offset)));
      fragment.appendChild(createBlankNode(match));
      lastIndex = offset + match.length;
      return match;
    });
    fragment.appendChild(document.createTextNode(source.slice(lastIndex)));

    textNode.parentNode.replaceChild(fragment, textNode);
  }

  function createBlankNode(text) {
    var span = document.createElement("span");
    span.className = "recall-blank";
    span.textContent = text;
    return span;
  }
})();
</script>
{{/短语块挖空}}
