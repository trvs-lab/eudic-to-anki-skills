{{FrontSide}}
<div class="section bounceInUp chunk-answer chunk-anchor-answer">
  <div class="items phrase-confirmation">{{短语块锚点}}</div>
  {{#例句}}
    <div class="items source-example">{{例句}}</div>
  {{/例句}}
  <div class="items word-header">
    <span class="word-header-word">{{单词}}</span>
    <span class="word-header-ipa">{{音标}}</span>
    <span class="word-header-meaning type">{{释义}}</span>
  </div>
  <div class="items english-definition">{{英英}}</div>
  {{#词根}}
    <div class="items root-field">{{词根}}</div>
  {{/词根}}
  <div class="items collocations-field">{{常用搭配}}</div>
  {{#学习标记}}
  <div class="priority-row"><span class="priority-marker">{{学习标记}}</span></div>
  {{/学习标记}}
</div>

<script type="text/javascript">
(function() {
  var colorMap = {
    "n.":"#86c440",
    "a.":"#f8b002",
    "adj.":"#727272",
    "ad.":"#684b9d",
    "adv.":"#684b9d",
    "v.":"#479cdf",
    "vi.":"#3e480d",
    "vt.":"#3e480d",
    "prep.":"#04B7C9",
    "conj.":"#04B7C9",
    "pron.":"#04B7C9",
    "art.":"#04B7C9",
    "num.":"#04B7C9",
    "int.":"#04B7C9",
    "interj.":"#04B7C9",
    "modal.":"#04B7C9",
    "aux.":"#04B7C9",
    "pl.":"#D111D3",
    "abbr.":"#D111D3",
    "na.":"#04B7C9"
  };
  [].forEach.call(document.querySelectorAll(".type"), function(div) {
    div.innerHTML = div.innerHTML.replace(/\b[a-z]+\./g, function(symbol) {
      if (colorMap[symbol]) {
        return '<a style="font-family:Georgia;font-style:italic;font-weight:bold;color:' +
          colorMap[symbol] + ';padding:0;margin-right:3px;">' +
          symbol + "</a>";
      }
      return symbol;
    });
  });

  var rootDiv = document.querySelector(".root-field");
  if (rootDiv) {
    var value = rootDiv.textContent.trim();
    if (value === "-" || value === "无") {
      rootDiv.style.display = "none";
    }
  }
})();
</script>
